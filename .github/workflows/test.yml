name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries for offscreen tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 dbus-daemon
      - name: Install test dependencies
        run: python -m pip install 'PySide6==6.8.3' pytest ruff
      - name: Install tested rustic release
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/rustic.tar.gz https://github.com/rustic-rs/rustic/releases/download/v0.11.4/rustic-v0.11.4-x86_64-unknown-linux-gnu.tar.gz
          echo 'c20bc3682c6275de3cfbc9317101dca5c0800a2fb5c610d0f9ef2addfd27cf81  /tmp/rustic.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rustic-bin
          tar --no-same-owner -xzf /tmp/rustic.tar.gz -C /tmp/rustic-bin rustic
          echo 'RUSTIC_TEST_BINARY=/tmp/rustic-bin/rustic' >> "$GITHUB_ENV"
      - name: Lint
        run: python -m ruff check timemachine tests install.py
      - name: Parse Plasma QML syntax
        run: pyside6-qmlformat -n plasma/org.cachyos.timemachine/contents/ui/main.qml > /tmp/timemachine.qml
      - name: Tests including real backup and restore
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
  plasma:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:latest
    steps:
      - name: Install native Plasma 6 runtime
        run: pacman -Syu --noconfirm git python pyside6 rustic plasma-workspace plasma-desktop plasma-integration kirigami kio-extras kdialog xdotool sway wtype qt6-wayland samba dbus libnotify ripgrep xorg-server-xvfb openbox
      - uses: actions/checkout@v4
      - name: Click applet in a real Plasma shell on a virtual X11 display
        env:
          QT_QPA_PLATFORM: xcb
          DISPLAY: ':99'
          QT_QUICK_BACKEND: software
          QT_FORCE_STDERR_LOGGING: '1'
          QT_LOGGING_RULES: 'qml.info=true;qml.warning=true'
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
          virtual_display_pid=$!
          trap 'kill "$virtual_display_pid"' EXIT
          python - <<'PY'
          from pathlib import Path
          import time
          deadline = time.monotonic() + 5
          while not Path('/tmp/.X11-unix/X99').exists():
              if time.monotonic() >= deadline:
                  raise SystemExit('Xvfb did not start')
              time.sleep(0.05)
          PY
          openbox > /tmp/openbox.log 2>&1 &
          dbus-run-session -- bash tests/plasma_smoke.sh
      - name: Open and accept KDE file choosers with a Wayland parent and child
        run: |
          useradd --create-home picker-test
          chmod -R a+rX "$GITHUB_WORKSPACE"
          runuser -u picker-test -- dbus-run-session -- bash tests/wayland_picker_smoke.sh
  nas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real SMB and KDE FUSE transport
        run: |
          sudo apt-get update
          sudo apt-get install -y samba kio-fuse kio-extras fuse3 dbus-daemon libegl1 libgl1 libopengl0 libxkbcommon0
          sudo systemctl stop smbd nmbd
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse
          python -m pip install 'PySide6==6.8.3'
          curl -fL --retry 3 -o /tmp/rustic.tar.gz https://github.com/rustic-rs/rustic/releases/download/v0.11.4/rustic-v0.11.4-x86_64-unknown-linux-gnu.tar.gz
          echo 'c20bc3682c6275de3cfbc9317101dca5c0800a2fb5c610d0f9ef2addfd27cf81  /tmp/rustic.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rustic-bin
          tar --no-same-owner -xzf /tmp/rustic.tar.gz -C /tmp/rustic-bin rustic
      - name: Backup, check, restore and reconnect through a real NAS share
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          nas_test_dir=$(mktemp -d /tmp/timemachine-nas-XXXXXX)
          chmod 755 "$nas_test_dir"
          mkdir -p "$nas_test_dir/share/Repository space" "$nas_test_dir/samba"
          cat > "$nas_test_dir/smb.conf" <<EOF
          [global]
          server role = standalone server
          interfaces = 127.0.0.1
          bind interfaces only = yes
          map to guest = Bad User
          log file = $nas_test_dir/samba/log.%m
          pid directory = $nas_test_dir/samba
          lock directory = $nas_test_dir/samba
          state directory = $nas_test_dir/samba
          cache directory = $nas_test_dir/samba
          private dir = $nas_test_dir/samba
          [Backups]
          path = $nas_test_dir/share
          guest ok = yes
          read only = no
          force user = $(id -un)
          EOF
          setsid sudo /usr/sbin/smbd --foreground --configfile="$nas_test_dir/smb.conf" > "$nas_test_dir/smbd.log" 2>&1 &
          nas_server_pid=$!
          trap 'sudo kill "$nas_server_pid" || true' EXIT
          python - <<'PY'
          import socket, time
          deadline = time.monotonic() + 10
          while True:
              try:
                  with socket.create_connection(('127.0.0.1', 445), timeout=1):
                      break
              except OSError:
                  if time.monotonic() > deadline:
                      raise
                  time.sleep(0.05)
          PY
          dbus-run-session -- python tests/nas_smoke.py "$nas_test_dir" /tmp/rustic-bin/rustic
